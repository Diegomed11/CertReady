# ---------------------------------------------------------------------------
# CI — servicios Go de CertReady (Fase 0).
#
# Esqueleto del pipeline: lint → test → build de imagen. El despliegue
# (push a ECR + update de servicio ECS) queda como stub documentado al final;
# se activará en la Fase 0/bloque de infraestructura, cuando existan el repo
# ECR y las credenciales OIDC hacia AWS.
#
# La matriz `service` permite añadir servicios nuevos cambiando una sola línea.
# ---------------------------------------------------------------------------
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancela ejecuciones previas del mismo ref para no malgastar runners.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-test:
    name: lint & test (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [health]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          # Sin dependencias externas aún (no hay go.sum): el caché no aporta.
          cache: false

      - name: Verificar formato (gofmt)
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::Archivos sin formatear con gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.61
          working-directory: services/${{ matrix.service }}
          # La config vive en la raíz del repo (.golangci.yml).
          args: --config=${{ github.workspace }}/.golangci.yml

      - name: Tests (con race detector y cobertura)
        # En runner Linux cgo está disponible, así que -race sí corre aquí
        # (no era posible en la máquina de desarrollo Windows sin compilador C).
        run: go test -race -cover ./...

  build-lambda:
    name: build lambda (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: lint-test
    strategy:
      fail-fast: false
      matrix:
        service: [health]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: false

      - name: Compilar y empaquetar el zip de Lambda
        # Produce build/<service>-lambda.zip con el binario bootstrap (arm64).
        run: make package-lambda

      - name: Publicar el artefacto de despliegue
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.service }}-lambda-${{ github.sha }}
          path: services/${{ matrix.service }}/build/${{ matrix.service }}-lambda.zip
          retention-days: 7

  # -------------------------------------------------------------------------
  # STUB — Despliegue a dev (se activa cuando exista la infraestructura AWS).
  #
  # Requisitos previos (Terraform, environments/dev):
  #   - Función Lambda creada (módulo lambda) + Function URL.
  #   - Rol OIDC de deploy (módulo cicd); su ARN en secrets.AWS_DEPLOY_ROLE_ARN.
  #
  # Pasos previstos (ruta de costo cero, ADR-07):
  #   deploy-dev:
  #     needs: build-lambda
  #     if: github.ref == 'refs/heads/main'
  #     permissions: { id-token: write, contents: read }   # OIDC
  #     steps:
  #       - actions/download-artifact@v4   (el zip de build-lambda)
  #       - aws-actions/configure-aws-credentials@v4
  #           role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
  #           aws-region: us-east-1
  #       - run: aws lambda update-function-code
  #           --function-name certready-dev-health
  #           --zip-file fileb://health-lambda.zip
  # -------------------------------------------------------------------------

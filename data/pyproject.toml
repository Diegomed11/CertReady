[project]
name = "certready-data"
version = "0.0.0"
description = "Capa de datos de CertReady: ETL operacional a dimensional (ClickHouse) y capa semántica (Cube)."
requires-python = ">=3.11"
dependencies = [
    "clickhouse-connect>=0.8",
    "pymongo>=4.6",
    "psycopg[binary]>=3.1",
    "numpy>=2.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
dev = ["ruff", "black", "pytest", "httpx>=0.27"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "certready-data"
version = "0.0.0"
description = "Capa de datos de CertReady: ETL operacional a dimensional (ClickHouse) y capa semántica (Cube)."
requires-python = ">=3.11"
dependencies = [
    "clickhouse-connect>=0.8",
    "pymongo>=4.6",
    "psycopg[binary]>=3.1",
    "numpy>=2.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
dev = ["ruff", "black", "pytest", "httpx>=0.27"]

# Paquetes Python de la capa de datos (layout plano). Se declaran de forma
# explícita: 'cube' es config de Cube (no Python) y 'tests' no se empaqueta.
[tool.setuptools]
packages = ["etl", "dss"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

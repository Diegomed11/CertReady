<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="720" fill="#FFFFFF"/>
  <text x="480" y="36" text-anchor="middle" font-size="23" font-weight="700" fill="#1C1B29">Entidad–relación (PostgreSQL — transaccional)</text>
  <text x="480" y="57" text-anchor="middle" font-size="12.5" fill="#5B5C70">Cada caja es una tabla. PK = id único · FK = apunta a otra tabla · entre servicios las referencias son lógicas (sin FK).</text>

  <!-- relaciones -->
  <g stroke="#5B5C70" stroke-width="1.8" fill="none">
    <line x1="155" y1="206" x2="155" y2="300"/>            <!-- usuarios-perfiles -->
    <line x1="470" y1="225" x2="470" y2="300"/>            <!-- cert-temas -->
    <line x1="570" y1="586" x2="690" y2="586"/>            <!-- sesiones-intentos -->
    <path d="M250 190 L350 190 L350 560 L370 560"/>        <!-- usuarios-sesiones -->
  </g>
  <g stroke="#9C8CFA" stroke-width="1.8" fill="none" stroke-dasharray="6 5">
    <path d="M250 110 L320 110 L320 76 L795 76 L795 92"/>  <!-- usuarios-inscripciones (logico) -->
    <path d="M250 165 L300 165 L300 360 L690 360"/>        <!-- usuarios-temas_progreso (logico) -->
  </g>
  <g font-size="11" fill="#5B5C70" font-weight="700">
    <text x="165" y="255">1—1</text>
    <text x="480" y="268">1—∞</text>
    <text x="615" y="578">1—∞</text>
    <text x="356" y="455">1—∞</text>
    <text x="520" y="70" fill="#7C5CD6">1—∞ (lógico)</text>
    <text x="470" y="352" fill="#7C5CD6">1—∞ (lógico)</text>
  </g>

  <!-- USUARIOS -->
  <rect x="60" y="92" width="190" height="114" rx="10" fill="#FFFFFF" stroke="#CDD0E6" stroke-width="1.5"/>
  <path d="M60 102 a10 10 0 0 1 10 -10 h170 a10 10 0 0 1 10 10 v18 h-190 z" fill="#4B5BF0"/>
  <text x="155" y="113" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">usuarios</text>
  <text x="74" y="140" font-size="11" fill="#1C1B29">id <tspan fill="#E0892B" font-weight="700">PK</tspan>  (= sub del JWT)</text>
  <text x="74" y="159" font-size="11" fill="#1C1B29">email</text>
  <text x="74" y="178" font-size="11" fill="#1C1B29">nombre</text>
  <text x="74" y="197" font-size="11" fill="#1C1B29">rol</text>

  <!-- PERFILES -->
  <rect x="60" y="300" width="190" height="95" rx="10" fill="#FFFFFF" stroke="#CDD0E6" stroke-width="1.5"/>
  <path d="M60 310 a10 10 0 0 1 10 -10 h170 a10 10 0 0 1 10 10 v18 h-190 z" fill="#4B5BF0"/>
  <text x="155" y="321" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">perfiles</text>
  <text x="74" y="348" font-size="11" fill="#1C1B29">usuario_id <tspan fill="#E0892B" font-weight="700">PK</tspan></text>
  <text x="74" y="367" font-size="11" fill="#1C1B29">bio</text>
  <text x="74" y="386" font-size="11" fill="#1C1B29">pais</text>

  <!-- CERTIFICACIONES -->
  <rect x="370" y="92" width="200" height="133" rx="10" fill="#FFFFFF" stroke="#CDD0E6" stroke-width="1.5"/>
  <path d="M370 102 a10 10 0 0 1 10 -10 h180 a10 10 0 0 1 10 10 v18 h-200 z" fill="#4B5BF0"/>
  <text x="470" y="113" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">certificaciones</text>
  <text x="384" y="140" font-size="11" fill="#1C1B29">id <tspan fill="#E0892B" font-weight="700">PK</tspan></text>
  <text x="384" y="159" font-size="11" fill="#1C1B29">slug</text>
  <text x="384" y="178" font-size="11" fill="#1C1B29">nombre</text>
  <text x="384" y="197" font-size="11" fill="#1C1B29">proveedor</text>
  <text x="384" y="216" font-size="11" fill="#1C1B29">nivel</text>

  <!-- TEMAS -->
  <rect x="370" y="300" width="200" height="133" rx="10" fill="#FFFFFF" stroke="#CDD0E6" stroke-width="1.5"/>
  <path d="M370 310 a10 10 0 0 1 10 -10 h180 a10 10 0 0 1 10 10 v18 h-200 z" fill="#4B5BF0"/>
  <text x="470" y="321" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">temas</text>
  <text x="384" y="348" font-size="11" fill="#1C1B29">id <tspan fill="#E0892B" font-weight="700">PK</tspan></text>
  <text x="384" y="367" font-size="11" fill="#1C1B29">certificacion_id <tspan fill="#2D6CDF" font-weight="700">FK</tspan></text>
  <text x="384" y="386" font-size="11" fill="#1C1B29">slug</text>
  <text x="384" y="405" font-size="11" fill="#1C1B29">dominio</text>
  <text x="384" y="424" font-size="11" fill="#1C1B29">orden</text>

  <!-- INSCRIPCIONES -->
  <rect x="690" y="92" width="210" height="133" rx="10" fill="#FFFFFF" stroke="#CDD0E6" stroke-width="1.5"/>
  <path d="M690 102 a10 10 0 0 1 10 -10 h190 a10 10 0 0 1 10 10 v18 h-210 z" fill="#4B5BF0"/>
  <text x="795" y="113" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">inscripciones</text>
  <text x="704" y="140" font-size="11" fill="#1C1B29">id <tspan fill="#E0892B" font-weight="700">PK</tspan></text>
  <text x="704" y="159" font-size="11" fill="#1C1B29">usuario_id</text>
  <text x="704" y="178" font-size="11" fill="#1C1B29">tipo_objetivo</text>
  <text x="704" y="197" font-size="11" fill="#1C1B29">objetivo_id</text>
  <text x="704" y="216" font-size="11" fill="#1C1B29">estado</text>

  <!-- TEMAS_PROGRESO -->
  <rect x="690" y="300" width="210" height="133" rx="10" fill="#FFFFFF" stroke="#CDD0E6" stroke-width="1.5"/>
  <path d="M690 310 a10 10 0 0 1 10 -10 h190 a10 10 0 0 1 10 10 v18 h-210 z" fill="#4B5BF0"/>
  <text x="795" y="321" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">temas_progreso</text>
  <text x="704" y="348" font-size="11" fill="#1C1B29">usuario_id</text>
  <text x="704" y="367" font-size="11" fill="#1C1B29">certificacion</text>
  <text x="704" y="386" font-size="11" fill="#1C1B29">tema</text>
  <text x="704" y="405" font-size="11" fill="#1C1B29">quiz_puntaje</text>
  <text x="704" y="424" font-size="11" fill="#1C1B29">quiz_aprobado</text>

  <!-- SESIONES -->
  <rect x="370" y="520" width="200" height="133" rx="10" fill="#FFFFFF" stroke="#CDD0E6" stroke-width="1.5"/>
  <path d="M370 530 a10 10 0 0 1 10 -10 h180 a10 10 0 0 1 10 10 v18 h-200 z" fill="#4B5BF0"/>
  <text x="470" y="541" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">sesiones</text>
  <text x="384" y="568" font-size="11" fill="#1C1B29">id <tspan fill="#E0892B" font-weight="700">PK</tspan></text>
  <text x="384" y="587" font-size="11" fill="#1C1B29">usuario_id</text>
  <text x="384" y="606" font-size="11" fill="#1C1B29">modo</text>
  <text x="384" y="625" font-size="11" fill="#1C1B29">puntaje</text>
  <text x="384" y="644" font-size="11" fill="#1C1B29">preguntas</text>

  <!-- INTENTOS -->
  <rect x="690" y="520" width="210" height="133" rx="10" fill="#FFFFFF" stroke="#CDD0E6" stroke-width="1.5"/>
  <path d="M690 530 a10 10 0 0 1 10 -10 h190 a10 10 0 0 1 10 10 v18 h-210 z" fill="#4B5BF0"/>
  <text x="795" y="541" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">intentos</text>
  <text x="704" y="568" font-size="11" fill="#1C1B29">id <tspan fill="#E0892B" font-weight="700">PK</tspan></text>
  <text x="704" y="587" font-size="11" fill="#1C1B29">sesion_id <tspan fill="#2D6CDF" font-weight="700">FK</tspan></text>
  <text x="704" y="606" font-size="11" fill="#1C1B29">usuario_id</text>
  <text x="704" y="625" font-size="11" fill="#1C1B29">pregunta_ref</text>
  <text x="704" y="644" font-size="11" fill="#1C1B29">correcto</text>

  <!-- leyenda -->
  <line x1="60" y1="688" x2="100" y2="688" stroke="#5B5C70" stroke-width="1.8"/>
  <text x="108" y="692" font-size="11.5" fill="#1C1B29">relación con FK</text>
  <line x1="240" y1="688" x2="280" y2="688" stroke="#9C8CFA" stroke-width="1.8" stroke-dasharray="6 5"/>
  <text x="288" y="692" font-size="11.5" fill="#1C1B29">referencia lógica (entre servicios, por id)</text>
</svg>

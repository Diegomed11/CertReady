<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5B5C70"/>
    </marker>
    <marker id="arrowDash" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#9C8CFA"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="700" fill="#FFFFFF"/>
  <text x="500" y="38" text-anchor="middle" font-size="24" font-weight="700" fill="#1C1B29">Arquitectura de microservicios — CertReady</text>
  <text x="500" y="60" text-anchor="middle" font-size="13" fill="#5B5C70">Cada servicio hace una sola cosa y es dueño de su base. Se hablan por API REST/JSON, nunca por la base de datos.</text>

  <!-- Clientes -->
  <rect x="250" y="86" width="220" height="52" rx="12" fill="#EEF0FF" stroke="#4B5BF0" stroke-width="1.5"/>
  <text x="360" y="110" text-anchor="middle" font-size="15" font-weight="700" fill="#1C1B29">Web — Next.js (BFF)</text>
  <text x="360" y="128" text-anchor="middle" font-size="11" fill="#5B5C70">el navegador solo habla con la web</text>

  <rect x="540" y="86" width="200" height="52" rx="12" fill="#EEF0FF" stroke="#4B5BF0" stroke-width="1.5"/>
  <text x="640" y="110" text-anchor="middle" font-size="15" font-weight="700" fill="#1C1B29">Móvil — Flutter</text>
  <text x="640" y="128" text-anchor="middle" font-size="11" fill="#5B5C70">llama directo a las APIs</text>

  <!-- Identidad -->
  <rect x="40" y="250" width="168" height="70" rx="12" fill="#F4F5FB" stroke="#CDD0E6" stroke-width="1.5"/>
  <text x="124" y="278" text-anchor="middle" font-size="13" font-weight="700" fill="#1C1B29">Identidad (OIDC)</text>
  <text x="124" y="296" text-anchor="middle" font-size="11" fill="#5B5C70">oidc-mock (dev)</text>
  <text x="124" y="311" text-anchor="middle" font-size="11" fill="#5B5C70">Cognito (prod)</text>

  <!-- Panel de servicios -->
  <rect x="234" y="176" width="540" height="248" rx="16" fill="#F4F5FB" stroke="#CDD0E6" stroke-width="1.5"/>
  <text x="504" y="200" text-anchor="middle" font-size="14" font-weight="700" fill="#3839B0">Microservicios en Go · APIs /v1 REST/JSON</text>

  <!-- fila 1 -->
  <g>
    <rect x="250" y="214" width="118" height="58" rx="10" fill="#FFFFFF" stroke="#2D6CDF" stroke-width="2"/>
    <text x="309" y="238" text-anchor="middle" font-size="13" font-weight="700" fill="#1C1B29">catalog</text>
    <text x="309" y="256" text-anchor="middle" font-size="10.5" fill="#2D6CDF">PostgreSQL</text>
  </g>
  <g>
    <rect x="378" y="214" width="118" height="58" rx="10" fill="#FFFFFF" stroke="#2D6CDF" stroke-width="2"/>
    <text x="437" y="238" text-anchor="middle" font-size="13" font-weight="700" fill="#1C1B29">users</text>
    <text x="437" y="256" text-anchor="middle" font-size="10.5" fill="#2D6CDF">PostgreSQL</text>
  </g>
  <g>
    <rect x="506" y="214" width="118" height="58" rx="10" fill="#FFFFFF" stroke="#2D6CDF" stroke-width="2"/>
    <text x="565" y="238" text-anchor="middle" font-size="13" font-weight="700" fill="#1C1B29">enrollments</text>
    <text x="565" y="256" text-anchor="middle" font-size="10.5" fill="#2D6CDF">PostgreSQL</text>
  </g>
  <g>
    <rect x="634" y="214" width="124" height="58" rx="10" fill="#FFFFFF" stroke="#16A34A" stroke-width="2"/>
    <text x="696" y="238" text-anchor="middle" font-size="13" font-weight="700" fill="#1C1B29">content</text>
    <text x="696" y="256" text-anchor="middle" font-size="10.5" fill="#16A34A">MongoDB</text>
  </g>

  <!-- fila 2 -->
  <g>
    <rect x="250" y="284" width="118" height="58" rx="10" fill="#FFFFFF" stroke="#7C5CD6" stroke-width="2"/>
    <text x="309" y="308" text-anchor="middle" font-size="13" font-weight="700" fill="#1C1B29">exams</text>
    <text x="309" y="326" text-anchor="middle" font-size="10.5" fill="#7C5CD6">Mongo + PG</text>
  </g>
  <g>
    <rect x="378" y="284" width="118" height="58" rx="10" fill="#FFFFFF" stroke="#16A34A" stroke-width="2"/>
    <text x="437" y="308" text-anchor="middle" font-size="13" font-weight="700" fill="#1C1B29">problems</text>
    <text x="437" y="326" text-anchor="middle" font-size="10.5" fill="#16A34A">MongoDB</text>
  </g>
  <g>
    <rect x="506" y="284" width="118" height="58" rx="10" fill="#FFFFFF" stroke="#2D6CDF" stroke-width="2"/>
    <text x="565" y="308" text-anchor="middle" font-size="13" font-weight="700" fill="#1C1B29">progress</text>
    <text x="565" y="326" text-anchor="middle" font-size="10.5" fill="#2D6CDF">PostgreSQL</text>
  </g>
  <g>
    <rect x="634" y="284" width="124" height="58" rx="10" fill="#FFFFFF" stroke="#E0892B" stroke-width="2"/>
    <text x="696" y="305" text-anchor="middle" font-size="13" font-weight="700" fill="#1C1B29">judge</text>
    <text x="696" y="322" text-anchor="middle" font-size="10" fill="#E0892B">Mongo + Docker</text>
    <text x="696" y="335" text-anchor="middle" font-size="9.5" fill="#5B5C70">sandbox aislado</text>
  </g>

  <!-- health nota -->
  <text x="504" y="366" text-anchor="middle" font-size="11" fill="#5B5C70">(+ health: servicio de referencia · cada servicio expone /v1/health y /v1/ready)</text>
  <text x="504" y="404" text-anchor="middle" font-size="11.5" fill="#5B5C70" font-style="italic">Sin foreign keys entre servicios: las referencias cruzadas son lógicas (por id, validadas por API).</text>

  <!-- DSS -->
  <rect x="800" y="250" width="172" height="76" rx="12" fill="#F3EEFF" stroke="#9C8CFA" stroke-width="1.5"/>
  <text x="886" y="276" text-anchor="middle" font-size="13" font-weight="700" fill="#1C1B29">DSS — Python</text>
  <text x="886" y="293" text-anchor="middle" font-size="10.5" fill="#5B5C70">FastAPI · readiness (IRT)</text>
  <text x="886" y="308" text-anchor="middle" font-size="10.5" fill="#5B5C70">recomendador de CV</text>

  <!-- Bases de datos -->
  <g>
    <rect x="120" y="500" width="210" height="66" rx="12" fill="#FFFFFF" stroke="#2D6CDF" stroke-width="2"/>
    <text x="225" y="528" text-anchor="middle" font-size="15" font-weight="700" fill="#2D6CDF">PostgreSQL</text>
    <text x="225" y="548" text-anchor="middle" font-size="11" fill="#5B5C70">transaccional (un esquema por servicio)</text>
  </g>
  <g>
    <rect x="395" y="500" width="210" height="66" rx="12" fill="#FFFFFF" stroke="#16A34A" stroke-width="2"/>
    <text x="500" y="528" text-anchor="middle" font-size="15" font-weight="700" fill="#16A34A">MongoDB</text>
    <text x="500" y="548" text-anchor="middle" font-size="11" fill="#5B5C70">contenido · preguntas · problemas</text>
  </g>
  <g>
    <rect x="670" y="500" width="230" height="66" rx="12" fill="#FFFFFF" stroke="#E0892B" stroke-width="2"/>
    <text x="785" y="528" text-anchor="middle" font-size="15" font-weight="700" fill="#E0892B">ClickHouse + Cube</text>
    <text x="785" y="548" text-anchor="middle" font-size="11" fill="#5B5C70">OLAP / modelo dimensional</text>
  </g>

  <!-- Flechas clientes -> panel -->
  <line x1="360" y1="138" x2="360" y2="174" stroke="#5B5C70" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="640" y1="138" x2="640" y2="174" stroke="#5B5C70" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="512" y="160" text-anchor="middle" font-size="11" fill="#5B5C70">APIs REST/JSON · /v1</text>

  <!-- servicios -> identidad (valida JWT) -->
  <line x1="234" y1="280" x2="210" y2="284" stroke="#5B5C70" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="150" y="240" text-anchor="middle" font-size="10.5" fill="#5B5C70">valida JWT</text>

  <!-- servicios -> Postgres y Mongo -->
  <line x1="330" y1="424" x2="250" y2="498" stroke="#5B5C70" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="500" y1="424" x2="500" y2="498" stroke="#5B5C70" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- DSS -> ClickHouse -->
  <line x1="886" y1="326" x2="810" y2="498" stroke="#5B5C70" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ETL Postgres/Mongo -> ClickHouse -->
  <path d="M330 540 Q 520 590 670 545" fill="none" stroke="#9C8CFA" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrowDash)"/>
  <text x="520" y="588" text-anchor="middle" font-size="11" font-weight="600" fill="#7C5CD6">ETL (incremental)</text>

  <!-- Leyenda -->
  <rect x="120" y="612" width="16" height="16" rx="3" fill="#2D6CDF"/>
  <text x="143" y="625" font-size="12" fill="#1C1B29">PostgreSQL</text>
  <rect x="245" y="612" width="16" height="16" rx="3" fill="#16A34A"/>
  <text x="268" y="625" font-size="12" fill="#1C1B29">MongoDB</text>
  <rect x="360" y="612" width="16" height="16" rx="3" fill="#E0892B"/>
  <text x="383" y="625" font-size="12" fill="#1C1B29">ClickHouse</text>
  <rect x="492" y="612" width="16" height="16" rx="3" fill="#9C8CFA"/>
  <text x="515" y="625" font-size="12" fill="#1C1B29">flujo analítico (ETL)</text>
</svg>

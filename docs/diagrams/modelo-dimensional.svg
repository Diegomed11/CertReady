<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 700" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="d1" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#7C5CD6"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1020" height="700" fill="#FFFFFF"/>
  <text x="510" y="32" text-anchor="middle" font-size="23" font-weight="700" fill="#1C1B29">Modelo dimensional (OLAP) — ClickHouse</text>
  <text x="510" y="53" text-anchor="middle" font-size="12.5" fill="#5B5C70">HECHO = algo que pasó (azul). DIMENSIÓN = forma de cortarlo (morado). En ClickHouse las dimensiones van como columnas del hecho.</text>

  <!-- Dimensiones comunes -->
  <rect x="350" y="66" width="320" height="46" rx="14" fill="#9C8CFA" stroke="#7C5CD6" stroke-width="1.5"/>
  <text x="510" y="86" text-anchor="middle" font-size="12.5" font-weight="700" fill="#FFFFFF">Dimensiones comunes a los 3 hechos</text>
  <text x="510" y="103" text-anchor="middle" font-size="11.5" fill="#FFFFFF">usuario · fecha (tiempo)</text>

  <!-- bus ortogonal comunes -> hechos (sin cruzar chips) -->
  <g stroke="#7C5CD6" stroke-width="1.6" stroke-dasharray="5 4" fill="none">
    <path d="M510 112 L510 150 M187 150 L837 150 M187 150 L187 296" marker-end="url(#d1)"/>
    <path d="M510 150 L510 296" marker-end="url(#d1)"/>
    <path d="M837 150 L837 296" marker-end="url(#d1)"/>
  </g>

  <!-- conectores hecho <-> dimensiones especificas -->
  <g stroke="#C9A6F0" stroke-width="1.4">
    <line x1="160" y1="300" x2="115" y2="232"/>
    <line x1="250" y1="300" x2="255" y2="232"/>
    <line x1="160" y1="392" x2="115" y2="413"/>
    <line x1="250" y1="392" x2="255" y2="413"/>
    <line x1="470" y1="300" x2="440" y2="232"/>
    <line x1="570" y1="300" x2="580" y2="232"/>
    <line x1="520" y1="392" x2="520" y2="413"/>
    <line x1="800" y1="300" x2="770" y2="232"/>
    <line x1="900" y1="300" x2="905" y2="232"/>
    <line x1="850" y1="392" x2="850" y2="413"/>
  </g>

  <!-- ===== HECHO 1: intento ===== -->
  <g font-size="11.5" fill="#1C1B29">
    <rect x="50" y="198" width="130" height="34" rx="17" fill="#F3EEFF" stroke="#9C8CFA"/>
    <text x="115" y="220" text-anchor="middle">certificación</text>
    <rect x="195" y="198" width="120" height="34" rx="17" fill="#F3EEFF" stroke="#9C8CFA"/>
    <text x="255" y="220" text-anchor="middle">tema</text>
    <rect x="50" y="413" width="130" height="34" rx="17" fill="#F3EEFF" stroke="#9C8CFA"/>
    <text x="115" y="435" text-anchor="middle">dificultad</text>
    <rect x="195" y="413" width="120" height="34" rx="17" fill="#F3EEFF" stroke="#9C8CFA"/>
    <text x="255" y="435" text-anchor="middle">tipo / modo</text>
  </g>
  <rect x="115" y="300" width="190" height="92" rx="12" fill="#EEF0FF" stroke="#4B5BF0" stroke-width="2.5"/>
  <text x="210" y="328" text-anchor="middle" font-size="15" font-weight="700" fill="#3839B0">fact_intento</text>
  <line x1="128" y1="340" x2="292" y2="340" stroke="#C9CEF2"/>
  <text x="210" y="358" text-anchor="middle" font-size="10.5" fill="#5B5C70">1 fila = 1 intento de pregunta</text>
  <text x="210" y="378" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1C1B29">medida: es_correcto (0/1)</text>

  <!-- ===== HECHO 2: codigo ===== -->
  <g font-size="11.5" fill="#1C1B29">
    <rect x="380" y="198" width="120" height="34" rx="17" fill="#F3EEFF" stroke="#9C8CFA"/>
    <text x="440" y="220" text-anchor="middle">área</text>
    <rect x="515" y="198" width="130" height="34" rx="17" fill="#F3EEFF" stroke="#9C8CFA"/>
    <text x="580" y="220" text-anchor="middle">lenguaje</text>
    <rect x="455" y="413" width="130" height="34" rx="17" fill="#F3EEFF" stroke="#9C8CFA"/>
    <text x="520" y="435" text-anchor="middle">veredicto</text>
  </g>
  <rect x="425" y="300" width="190" height="92" rx="12" fill="#EEF0FF" stroke="#4B5BF0" stroke-width="2.5"/>
  <text x="520" y="328" text-anchor="middle" font-size="15" font-weight="700" fill="#3839B0">fact_codigo</text>
  <line x1="438" y1="340" x2="602" y2="340" stroke="#C9CEF2"/>
  <text x="520" y="358" text-anchor="middle" font-size="10.5" fill="#5B5C70">1 fila = 1 ejecución del juez</text>
  <text x="520" y="378" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1C1B29">medidas: aceptado, duración</text>

  <!-- ===== HECHO 3: qa ===== -->
  <g font-size="11.5" fill="#1C1B29">
    <rect x="710" y="198" width="120" height="34" rx="17" fill="#F3EEFF" stroke="#9C8CFA"/>
    <text x="770" y="220" text-anchor="middle">puesto</text>
    <rect x="845" y="198" width="120" height="34" rx="17" fill="#F3EEFF" stroke="#9C8CFA"/>
    <text x="905" y="220" text-anchor="middle">área</text>
    <rect x="785" y="413" width="130" height="34" rx="17" fill="#F3EEFF" stroke="#9C8CFA"/>
    <text x="850" y="435" text-anchor="middle">categoría</text>
  </g>
  <rect x="755" y="300" width="190" height="92" rx="12" fill="#EEF0FF" stroke="#4B5BF0" stroke-width="2.5"/>
  <text x="850" y="328" text-anchor="middle" font-size="15" font-weight="700" fill="#3839B0">fact_qa</text>
  <line x1="768" y1="340" x2="932" y2="340" stroke="#C9CEF2"/>
  <text x="850" y="358" text-anchor="middle" font-size="10.5" fill="#5B5C70">1 fila = 1 autoevaluación Q&amp;A</text>
  <text x="850" y="378" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1C1B29">medida: nivel (1–3)</text>

  <!-- etl_estado: control -->
  <rect x="120" y="500" width="360" height="86" rx="12" fill="#FBF6EE" stroke="#E0892B" stroke-width="1.5"/>
  <rect x="120" y="500" width="360" height="28" rx="12" fill="#E0892B"/>
  <text x="300" y="519" text-anchor="middle" font-size="12.5" font-weight="700" fill="#FFFFFF">etl_estado · control del ETL (no es un hecho)</text>
  <text x="138" y="548" font-size="11.5" fill="#1C1B29">fuente · ultimo_ts (la "marca de agua")</text>
  <text x="138" y="568" font-size="10.5" fill="#5B5C70">recuerda hasta dónde cargó el ETL, para traer solo lo nuevo</text>

  <!-- Cube nota -->
  <rect x="540" y="500" width="360" height="86" rx="12" fill="#F4F5FB" stroke="#CDD0E6" stroke-width="1.5"/>
  <rect x="540" y="500" width="360" height="28" rx="12" fill="#4B5BF0"/>
  <text x="720" y="519" text-anchor="middle" font-size="12.5" font-weight="700" fill="#FFFFFF">Cube · capa semántica</text>
  <text x="558" y="548" font-size="11.5" fill="#1C1B29">calcula las medidas de negocio sobre los hechos:</text>
  <text x="558" y="568" font-size="11.5" fill="#1C1B29">accuracy = aciertos/total · tasa de aceptación · …</text>

  <!-- leyenda -->
  <rect x="120" y="616" width="16" height="16" rx="4" fill="#EEF0FF" stroke="#4B5BF0" stroke-width="2"/>
  <text x="144" y="629" font-size="12" fill="#1C1B29">Hecho</text>
  <rect x="250" y="616" width="16" height="16" rx="8" fill="#F3EEFF" stroke="#9C8CFA"/>
  <text x="274" y="629" font-size="12" fill="#1C1B29">Dimensión propia</text>
  <line x1="430" y1="624" x2="462" y2="624" stroke="#7C5CD6" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="470" y="629" font-size="12" fill="#1C1B29">dimensión común a los 3 hechos</text>

  <text x="510" y="662" text-anchor="middle" font-size="11" fill="#5B5C70">Nota: en el código el hecho de ejecuciones se llama <tspan font-family="monospace">fact_ejecucion</tspan>; aquí <tspan font-family="monospace">fact_codigo</tspan> por claridad.</text>
</svg>
